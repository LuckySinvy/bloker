<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录失败</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        background: white;
        border: 1px solid #d7dfea;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      }
      h1 { margin: 0 0 12px; font-size: 24px; color: #1f2937; }
      p { margin: 0 0 18px; color: #667085; line-height: 1.6; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        padding: 12px 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>密码错误</h1>
      <p>当前输入的管理密码无效，请返回重新输入。</p>
      <a href="/admin/login">返回登录</a>
    </div>
  </body>
</html>
